{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Changed | Holistic Nepal</title>
<link rel="icon" href="{% static 'Images/Holistic Logo.png' %}" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=swap">
<style>
  :root{
    --ink:#121820;
    --paper:#f3f5f7;
    --surface:#ffffff;
    --accent:#1f6f5c;
    --accent-soft:#e5f2ee;
    --text:#1a1f26;
    --text-muted:#6b7280;
    --border:#e4e7eb;
  }
  *{box-sizing:border-box; border-radius:0 !important;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background:var(--paper);
    color:var(--text);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }
  a{text-decoration:none;color:inherit;}

  .complete-card{
    width:100%;
    max-width:440px;
    background:var(--surface);
    padding:44px 36px;
    border:1px solid var(--border);
    box-shadow:0 12px 36px rgba(18,24,32,0.06);
    text-align:center;
  }

  .check-icon-wrap{
    width:60px;
    height:60px;
    margin:0 auto 20px;
    background:var(--accent-soft);
    color:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .complete-card h1{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size:24px;
    font-weight:600;
    margin:0 0 10px;
    color:var(--text);
  }

  .complete-card p{
    font-size:14px;
    line-height:1.6;
    color:var(--text-muted);
    margin:0 0 28px;
  }

  .btn-login{
    display:flex;
    align-items:center;
    justify-content:center;
    width:100%;
    height:44px;
    background:var(--accent);
    color:#fff;
    font-weight:600;
    font-size:14px;
    letter-spacing:0.02em;
    transition:background-color .15s;
  }
  .btn-login:hover{background:#185849;}
</style>
</head>
<body>

<div class="complete-card">
  <div class="check-icon-wrap">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
  </div>

  <h1>Password Updated</h1>
  <p>Your password has been changed successfully. You can now log into your customer account using your new credentials.</p>

  <a href="{% url 'login' %}" class="btn-login">Log In to Account</a>
</div>

</body>
</html>
