{% load static %}

<style>
  /* ---------- User Sidebar ---------- */
  .sidebar{
    width:252px;
    flex-shrink:0;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
    align-self:flex-start;
    overflow:hidden;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
    text-decoration:none;
  }
  .brand img{
    width:38px;
    height:38px;
    object-fit:cover;
  }
  .brand-text{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.02em;
    color:#fff;
    line-height:1.15;
  }
  .brand-text span{
    display:block;
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-weight:400;
    font-size:11.5px;
    color:var(--text-on-ink-dim);
    margin-top:2px;
  }

  .nav-scroll{
    flex:1;
    padding:14px 12px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--accent) var(--ink-soft);
  }
  .nav-scroll::-webkit-scrollbar{width:7px;}
  .nav-scroll::-webkit-scrollbar-track{background:var(--ink-soft);}
  .nav-scroll::-webkit-scrollbar-thumb{
    background:var(--accent);
    border:1px solid transparent;
    background-clip:padding-box;
  }
  .nav-scroll::-webkit-scrollbar-thumb:hover{background:#2d8a72;}

  .nav-group-label{
    font-size:11.5px;
    color:var(--text-on-ink-dim);
    padding:16px 12px 6px;
    letter-spacing:0.01em;
  }
  .nav-group-label:first-child{padding-top:6px;}

  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 12px;
    margin:1px 0;
    color:var(--text-on-ink);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s ease, color .15s ease;
    text-decoration:none;
  }
  .nav-item:hover{
    background:rgba(255,255,255,0.06);
    color:#fff;
  }
  .nav-item.active{
    background:rgba(31,111,92,0.28);
    color:#fff;
    border-left:2px solid var(--accent);
  }
  .nav-item svg{
    width:17px;
    height:17px;
    flex-shrink:0;
    fill:none;
    stroke:var(--text-on-ink-dim);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .nav-item.active svg{stroke:var(--accent);}
  .nav-item:hover svg{stroke:#fff;}

  .sidebar-foot{
    padding:14px 12px 18px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .logout{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    color:#e8b4a4;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    text-decoration:none;
  }
  .logout svg{
    width:17px;
    height:17px;
    flex-shrink:0;
    fill:none;
    stroke:#e8b4a4;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .logout:hover{background:rgba(194,65,12,0.12); color:#f3c7ba;}
  .logout:hover svg{stroke:#f3c7ba;}

  @media (max-width: 760px){
    .sidebar{
      position:fixed;
      left:-100%;
      top:0;
      width:100%;
      height:100vh;
      z-index:20;
      transition:left .2s ease;
    }
    .sidebar.open{left:0;}
  }
</style>

<aside class="sidebar" id="sidebar">
  <a href="{% url 'home' %}" class="brand">
    <img src="{% static 'Images/Holistic Logo.png' %}" alt="Logo">
    <div class="brand-text">HOLISTIC</div>
  </a>

  <nav class="nav-scroll">
    <div class="nav-group-label">Account</div>
    <a href="{% url 'user_dashboard' %}" class="nav-item {% if active_page == 'dashboard' or not active_page %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </a>

    <a href="{% url 'user_orders' %}" class="nav-item {% if active_page == 'orders' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      My Orders
    </a>

    <a href="{% url 'user_settings' %}" class="nav-item {% if active_page == 'settings' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      Settings
    </a>
  </nav>

  <div class="sidebar-foot">
    <a href="{% url 'logout' %}" class="logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </a>
  </div>
</aside>
