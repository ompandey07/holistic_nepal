{% load static %}

<style>
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:252px;
    flex-shrink:0;
    background:var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
    position:sticky;
    top:0;
    align-self:flex-start;
    overflow:hidden;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px;
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .brand img{
    width:38px;
    height:38px;
    object-fit:cover;
  }
  .brand-text{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:18px;
    letter-spacing:0.02em;
    color:#fff;
    line-height:1.15;
  }
  .brand-text span{
    display:block;
    font-family:'Inter',sans-serif;
    font-weight:400;
    font-size:11.5px;
    color:var(--text-on-ink-dim);
    margin-top:2px;
  }

  .nav-scroll{
    flex:1;
    padding:14px 12px;
    overflow-y:auto;
    scrollbar-width:thin;
    scrollbar-color:var(--accent) var(--ink-soft);
  }
  .nav-scroll::-webkit-scrollbar{width:7px;}
  .nav-scroll::-webkit-scrollbar-track{background:var(--ink-soft);}
  .nav-scroll::-webkit-scrollbar-thumb{
    background:var(--accent);
    border:1px solid transparent;
    background-clip:padding-box;
  }
  .nav-scroll::-webkit-scrollbar-thumb:hover{background:#2d8a72;}

  .nav-group-label{
    font-size:11.5px;
    color:var(--text-on-ink-dim);
    padding:16px 12px 6px;
    letter-spacing:0.01em;
  }
  .nav-group-label:first-child{padding-top:6px;}

  .nav-item{
    display:flex;
    align-items:center;
    gap:11px;
    padding:9px 12px;
    margin:1px 0;
    color:var(--text-on-ink);
    font-size:14px;
    font-weight:500;
    cursor:pointer;
    border-left:2px solid transparent;
    transition:background .15s ease, color .15s ease;
  }
  .nav-item:hover{
    background:rgba(255,255,255,0.06);
    color:#fff;
  }
  .nav-item.active{
    background:rgba(31,111,92,0.28);
    color:#fff;
    border-left:2px solid var(--accent);
  }
  .nav-item svg{
    width:17px;
    height:17px;
    flex-shrink:0;
    fill:none;
    stroke:var(--text-on-ink-dim);
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .nav-item.active svg{stroke:var(--accent);}
  .nav-item:hover svg{stroke:#fff;}

  .sidebar-foot{
    padding:14px 12px 18px;
    border-top:1px solid rgba(255,255,255,0.08);
  }
  .logout{
    display:flex;
    align-items:center;
    gap:11px;
    padding:10px 12px;
    color:#e8b4a4;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .logout svg{
    width:17px;
    height:17px;
    flex-shrink:0;
    fill:none;
    stroke:#e8b4a4;
    stroke-width:1.8;
    stroke-linecap:round;
    stroke-linejoin:round;
  }
  .logout:hover{background:rgba(194,65,12,0.12); color:#f3c7ba;}
  .logout:hover svg{stroke:#f3c7ba;}

  @media (max-width: 760px){
    .sidebar{
      position:fixed;
      left:-100%;
      top:0;
      width:100%;
      height:100vh;
      z-index:20;
      transition:left .2s ease;
    }
    .sidebar.open{left:0;}
  }
</style>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <img src="{% static 'Images/Holistic Logo.png' %}" alt="Logo">
    <div class="brand-text">HOLISTIC</div>
  </div>

  <nav class="nav-scroll">
    <div class="nav-item {% if active_page == 'dashboard' or not active_page %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
      Dashboard
    </div>

    <div class="nav-group-label">Employee roles</div>
    <div class="nav-item {% if active_page == 'employee_setup' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 21c0-3.6 3-5.6 6.5-5.6s6.5 2 6.5 5.6"/><path d="M16.5 3.5a3.2 3.2 0 010 6.2"/><path d="M19 14.7c2 .5 3.5 2 3.5 4.3"/></svg>
      Employee Setup
    </div>

    <div class="nav-group-label">Inventory</div>
    <div class="nav-item {% if active_page == 'products' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
      Products
    </div>
    <div class="nav-item {% if active_page == 'units' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="18" r="2"/></svg>
      Units
    </div>
    <div class="nav-item {% if active_page == 'category' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M12.59 21L21 12.59a2 2 0 000-2.83L13.83 2.6A2 2 0 0012.41 2H5a2 2 0 00-2 2v7.41a2 2 0 00.59 1.41L11 21a1.6 1.6 0 001.59 0z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
      Category
    </div>

    <div class="nav-group-label">Uploads</div>
    <div class="nav-item {% if active_page == 'gallery' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Gallery
    </div>
    <div class="nav-item {% if active_page == 'news' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M4 4h16v13a2 2 0 01-2 2H6a2 2 0 01-2-2V4z"/><line x1="8" y1="8" x2="16" y2="8"/><line x1="8" y1="12" x2="16" y2="12"/><line x1="8" y1="16" x2="12" y2="16"/></svg>
      News
    </div>

    <div class="nav-group-label">Orders and invoice</div>
    <div class="nav-item {% if active_page == 'orders' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
      Orders
    </div>
    <div class="nav-item {% if active_page == 'invoices' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Invoices
    </div>
    <div class="nav-item {% if active_page == 'receipt' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M6 2h12v19l-3-2-3 2-3-2-3 2V2z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
      Receipt
    </div>

    <div class="nav-group-label">Reports</div>
    <div class="nav-item {% if active_page == 'order_reports' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>
      Order Reports
    </div>
    <div class="nav-item {% if active_page == 'sales_reports' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>
      Sales Reports
    </div>
    <div class="nav-item {% if active_page == 'receipt_reports' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><path d="M9 2h6v3H9z"/><path d="M6 4h12v18H6z"/><line x1="9" y1="10" x2="15" y2="10"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
      Receipt Reports
    </div>

    <div class="nav-group-label">Audit logs</div>
    <div class="nav-item {% if active_page == 'employee_logs' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
      Employee Logs
    </div>
    <div class="nav-item {% if active_page == 'employee_activity' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Employee Activity
    </div>
    <div class="nav-item {% if active_page == 'public_users' %}active{% endif %}">
      <svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="3"/><path d="M2 20c0-3.5 2.7-5.5 6-5.5s6 2 6 5.5"/><circle cx="17" cy="8" r="2.5"/><path d="M14.5 14.8c2.6.3 4.5 2 4.5 5.2"/></svg>
      Public Users List
    </div>
  </nav>

  <div class="sidebar-foot">
    <div class="logout">
      <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </div>
  </div>
</aside>
